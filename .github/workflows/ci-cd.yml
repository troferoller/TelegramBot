name: Telegram Bot CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # 1. Проверка и тестирование (CI)
  # -------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f test-requirements.txt ]; then pip install -r test-requirements.txt; fi
          pip install pytest

      - name: Run Tests
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Запуск unit-тестов (если папка с тестами существует)
          if [ -d "tests" ]; then pytest; else echo "No tests directory found, skipping."; fi

  # -------------------------------------------------------------
  # 2. Сборка и отправка Docker-образа (CD)
  # -------------------------------------------------------------
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/telegram-bot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/telegram-bot:${{ github.sha }}
            
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Авторизуемся в Docker Hub на сервере
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 2. Скачиваем свежий образ
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/telegram-bot:latest

            # 3. Останавливаем и удаляем старый контейнер (если он существует)
            docker stop telegram-bot || true
            docker rm telegram-bot || true

            # 4. Запускаем новый контейнер с передачей токена бота
            docker run -d \
              --name telegram-bot \
              --restart unless-stopped \
              -e BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/telegram-bot:latest

            # 5. Очищаем неиспользуемые старые образа для экономии места
            docker image prune -f
